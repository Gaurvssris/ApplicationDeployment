apiVersion: apps/v1
kind: Deployment

metadata:
  name: devopsking

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devopsking

  template:
    metadata:
      labels:
        app: devopsking

    spec:
      containers:
      - name: devopsking

        image: acrdev12345.azurecr.io/devopsking:v1

        ports:
        - containerPort: 80