<!DOCTYPE html>
<html>
<head>
<title>DevOps Kingdom</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff0066,#6a00ff,#00c3ff,#00ff88);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
text-align:center;
color:white;
padding:20px;
}

h1{
font-size:70px;
animation:glow 2s infinite alternate;
}

h2{
font-size:35px;
margin-top:20px;
}

p{
font-size:25px;
margin-top:20px;
}

@keyframes glow{
from{
text-shadow:0 0 10px white;
}
to{
text-shadow:
0 0 20px yellow,
0 0 40px orange,
0 0 60px red;
}
}

.badges{
margin-top:40px;
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.badge{
padding:15px 25px;
border-radius:10px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
font-size:22px;
font-weight:bold;
animation:float 3s infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

</style>
</head>

<body>

<div class="container">

<h1>DEVOPS KINGDOM</h1>

<h2>I Want To Become A Complete DevOps Engineer</h2>

<p>
Master of DevOps • DevSecOps • MLOps • AI Engineering • Kubernetes • Terraform • Azure Cloud
</p>

<div class="badges">

<div class="badge">DevOps</div>

<div class="badge">DevSecOps</div>

<div class="badge">MLOps</div>

<div class="badge">AI</div>

<div class="badge">Terraform</div>

<div class="badge">Azure</div>

<div class="badge">Docker</div>

<div class="badge">Kubernetes</div>

</div>

</div>

</body>
</html>
